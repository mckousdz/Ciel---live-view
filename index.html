<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#030512"><title>Petit Explorateur du Ciel V3</title><style>

#mission.show{display:block}

#cross{position:fixed;z-index:2;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);border:1px solid #fff3;border-radius:50%;pointer-events:none}

#cross:before{width:1px;height:74px;left:29px;top:-8px}

<script>
/* ===== état global ===== */
const c=document.getElementById('sky'),x=c.getContext('2d'),fx=document.getElementById('fx'),fxx=fx.getContext('2d');
let W,H,D=1,lat=43.3,lon=5.37,hgt=0,head=0,located=false,oriented=false,showSat=false,sats=[],satOK=false;
let astroMode=localStorage.getItem('skyAstro')==='1';
let nightMode=localStorage.getItem('skyNight')==='1';
let arMode=false,camStream=null;
let zoom=1,MINZ=.6,MAXZ=3.2,panX=0,panY=0;
let pointers=new Map(),pinch=null,tapStart=null,panStart=null;
function clampPan(){let maxPan=Math.max(0,zoom-1)*Math.min(W,H)*.5;panX=Math.max(-maxPan,Math.min(maxPan,panX));panY=Math.max(-maxPan,Math.min(maxPan,panY));if(zoom<=1.02){panX=0;panY=0}}

/* ===== catalogue d'étoiles réelles (nom, ra en heures, dec en degrés, magnitude, icône, description) ===== */
const S=[
['Sirius',6.7525,-16.7161,-1.46,'🐕','Une des étoiles les plus brillantes du ciel.'],

['Alnilam',5.6036,-1.2019,1.69,'🏹','Une étoile de la ceinture d’Orion.'],
['Alnitak',5.6793,-1.9426,1.74,'🏹','Une étoile de la ceinture d’Orion.'],
['Mintaka',5.5334,-.2991,2.23,'🏹','Une étoile de la ceinture d’Orion.'],

['Mizar',13.3987,54.9254,2.23,'🐻','Une étoile double, avec une petite compagne à côté.'],
['Alkaid',13.7923,49.3133,1.86,'🐻','Le bout de la longue queue de la Grande Ourse.'],
['Polaris',2.5303,89.2641,1.98,'🧭','L’étoile du Nord ! Elle reste toujours à la même place.'],
['Kochab',14.8451,74.1555,2.08,'🐻','Une étoile orangée qui garde la Petite Ourse.'],
['Pherkad',15.3455,71.834,3.05,'🐻','Elle brille doucement juste à côté de Kochab.'],
['Yildun',17.5366,86.5864,4.36,'🐻','Une petite étoile du manche de la Petite Ourse.'],
['Schedar',.6751,56.5373,2.24,'👑','Le cœur scintillant de la reine Cassiopée.'],
['Caph',.153,59.1498,2.28,'👑','Un coin du grand W de Cassiopée.'],
['Gamma Cassiopée',.9451,60.7167,2.47,'👑','Une étoile qui change parfois un peu de lumière !'],
['Ruchbah',1.43,60.2353,2.68,'👑','Une étoile du dossier du trône de la reine.'],
['Segin',1.9066,63.6701,3.35,'👑','Le dernier trait du grand W de Cassiopée.'],
['Dschubba',16.0056,-22.6217,2.29,'🦂','La tête piquante du Scorpion.'],
['Shaula',17.5601,-37.1038,1.62,'🦂','Le dard tout au bout de la queue du Scorpion.'],

['Elnath',5.4382,28.6075,1.65,'🐂','La pointe d’une des cornes du Taureau.']
].map(a=>({n:a[0],ra:a[1],dec:a[2],m:a[3],i:a[4],f:a[5]}));

/* ===== constellations : identifiant, nom, icône, couleur, histoire, étoiles, traits ===== */
const CONS=[
{id:'orion',name:'Orion',icon:'🏹',color:'#ffb37a',story:'Orion est un grand chasseur du ciel. Sa ceinture est formée de trois étoiles bien alignées, et il lève son arc vers les étoiles.',
 stars:['Betelgeuse','Bellatrix','Alnilam','Alnitak','Mintaka','Rigel'],
 lines:[['Betelgeuse','Bellatrix'],['Betelgeuse','Alnilam'],['Alnilam','Alnitak'],['Alnilam','Mintaka'],['Rigel','Mintaka'],['Betelgeuse','Rigel']]},
{id:'grande_ourse',name:'Grande Ourse',icon:'🐻',color:'#8fd7ff',story:'La Grande Ourse ressemble à une immense casserole dans le ciel ! Ses sept étoiles dessinent le dos et la longue queue d’une maman ourse.',
 stars:['Dubhe','Merak','Phecda','Megrez','Alioth','Mizar','Alkaid'],
 lines:[['Dubhe','Merak'],['Merak','Phecda'],['Phecda','Megrez'],['Megrez','Dubhe'],['Megrez','Alioth'],['Alioth','Mizar'],['Mizar','Alkaid']]},
{id:'petite_ourse',name:'Petite Ourse',icon:'🐻',color:'#c9b8ff',story:'La Petite Ourse suit toujours sa maman dans le ciel. Au bout de sa queue brille Polaris, l’étoile du Nord, qui ne bouge jamais toute la nuit.',
 stars:['Polaris','Yildun','Kochab','Pherkad'],
 lines:[['Polaris','Yildun'],['Yildun','Kochab'],['Kochab','Pherkad']]},
{id:'cassiopee',name:'Cassiopée',icon:'👑',color:'#ffd86b',story:'Cassiopée est une reine assise sur son trône. Ses cinq étoiles dessinent un grand W scintillant tout en haut du ciel.',
 stars:['Caph','Schedar','Gamma Cassiopée','Ruchbah','Segin'],
 lines:[['Caph','Schedar'],['Schedar','Gamma Cassiopée'],['Gamma Cassiopée','Ruchbah'],['Ruchbah','Segin']]},
{id:'scorpion',name:'Scorpion',icon:'🦂',color:'#ff8b8b',story:'Le Scorpion rampe tout en bas du ciel d’été. Son cœur rouge, Antarès, brille comme une braise, et sa queue se termine par un dard piquant.',
 stars:['Dschubba','Antares','Shaula'],
 lines:[['Dschubba','Antares'],['Antares','Shaula']]},
{id:'lion',name:'Lion',icon:'🦁',color:'#ffcf6b',story:'Le Lion s’étire fièrement dans le ciel de printemps, de sa crinière jusqu’au bout de sa queue.',
 stars:['Regulus','Denebola'],
 lines:[['Regulus','Denebola']]},
{id:'gemeaux',name:'Gémeaux',icon:'👯',color:'#9cffe0',story:'Castor et Pollux sont deux frères jumeaux qui brillent toujours côte à côte, comme s’ils se tenaient la main.',
 stars:['Castor','Pollux'],
 lines:[['Castor','Pollux']]},
{id:'taureau',name:'Taureau',icon:'🐂',color:'#ffb37a',story:'Le Taureau baisse ses grandes cornes vers le ciel, avec Aldebaran, son œil orangé, qui brille au milieu du troupeau d’étoiles.',
 stars:['Aldebaran','Elnath'],
 lines:[['Aldebaran','Elnath']]}
];

const P=[['Mercure','Mercury','☿️','La planète la plus proche du Soleil.'],['Vénus','Venus','♀️','Très brillante, parfois appelée étoile du berger.'],['Mars','Mars','♂️','La planète rouge.'],['Jupiter','Jupiter','♃','La plus grande planète du Système solaire.'],['Saturne','Saturn','🪐','La planète aux magnifiques anneaux.']];

/* ===== géométrie / astronomie ===== */
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0);fx.width=W*D;fx.height=H*D;fx.style.width=W+'px';fx.style.height=H+'px';fxx.setTransform(D,0,0,D,0,0);genBg()}
addEventListener('resize',resize);
function rad(v){return v*Math.PI/180}
function deg(v){return v*180/Math.PI}
function jd(d){return d.getTime()/86400000+2440587.5}
function lst(d){let T=(jd(d)-2451545)/36525,g=280.46061837+360.98564736629*(jd(d)-2451545)+.000387933*T*T-T*T*T/38710000;return((g+lon)%360+360)%360}
function aa(s,d){let H=((lst(d)/15-s.ra+24)%24)*15,r=rad(H),dc=rad(s.dec),la=rad(lat),alt=Math.asin(Math.sin(dc)*Math.sin(la)+Math.cos(dc)*Math.cos(la)*Math.cos(r)),az=Math.atan2(-Math.sin(r)*Math.cos(dc),Math.sin(dc)*Math.cos(la)-Math.cos(dc)*Math.sin(la)*Math.cos(r));return{alt:deg(alt),az:(deg(az)+360)%360}}
function pos(az,alt){let a=az-(oriented?head:0),r=(90-alt)/90*Math.min(W,H)*.46*zoom;return{x:W/2+Math.sin(rad(a))*r+panX,y:H/2-Math.cos(rad(a))*r+panY}}
function paa(body,d){try{let o=new Astronomy.Observer(lat,lon,hgt),q=Astronomy.Equator(body,d,o,true,true),h=Astronomy.Horizon(d,o,q.ra,q.dec,'normal');return{alt:h.altitude,az:h.azimuth,ra:q.ra,dec:q.dec,dist:q.dist}}catch(e){return null}}
function illum(body,d){try{return Astronomy.Illumination(body,d)}catch(e){return null}}
function moonPhaseInfo(d){let a=Astronomy.MoonPhase(d),map=['🌑 Nouvelle lune','🌒 Premier croissant','🌓 Premier quartier','🌔 Lune gibbeuse (croissante)','🌕 Pleine lune','🌖 Lune gibbeuse (décroissante)','🌗 Dernier quartier','🌘 Dernier croissant'];return{angle:a,label:map[Math.round(a/45)%8]}}
function satPos(s,d){try{let q=satellite.propagate(s.satrec,d);if(!q.position)return null;let ecf=satellite.eciToEcf(q.position,satellite.gstime(d)),o={longitude:rad(lon),latitude:rad(lat),height:hgt/1000},z=satellite.ecfToLookAngles(o,ecf);return{az:deg(z.azimuth),alt:deg(z.elevation),range:z.rangeSat}}catch(e){return null}}

/* ===== champ d'étoiles de fond (décor, non lié à de vraies coordonnées) ===== */
let bg=[];
function genBg(){bg=[];let n=Math.floor((W*H)/4200);for(let i=0;i<n;i++)bg.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.2,tw:Math.random()*6.28,sp:.4+Math.random()*1.3,b:.12+Math.random()*.35})}

/* ===== carnet de découvertes (persisté) ===== */
function loadCarnet(){
  let raw=localStorage.getItem('skyCarnet');
  if(raw){try{return JSON.parse(raw)}catch(e){}}
  let cnt={stars:[],planets:[],satellites:[],constellations:[],moon:[]};
  try{
    let old=JSON.parse(localStorage.getItem('skyBook')||'[]');
    old.forEach(s=>{if(typeof s!=='string')return;if(s.indexOf('⭐')===0)cnt.stars.push(s.replace('⭐','').trim());else if(s.indexOf('🪐')===0)cnt.planets.push(s.replace('🪐','').trim());else if(s.indexOf('🛰️')===0)cnt.satellites.push(s.replace('🛰️','').trim())});
  }catch(e){}
  return cnt;
}
let carnet=loadCarnet();
function saveCarnet(){localStorage.setItem('skyCarnet',JSON.stringify(carnet))}
function addFound(cat,name){if(!carnet[cat].includes(name)){carnet[cat].push(name);saveCarnet();return true}return false}

/* ===== mission du soir (générée automatiquement chaque jour) ===== */
function todayKey(){return new Date().toISOString().slice(0,10)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function buildMission(){let s=todayKey(),h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;let rnd=mulberry32(h);return{date:s,star:S[Math.floor(rnd()*S.length)].n,cons:CONS[Math.floor(rnd()*CONS.length)].id,foundStar:false,foundCons:false,foundMoon:false,foundSat:false,celebrated:false}}
function loadMission(){let raw=localStorage.getItem('skyMission');if(raw){try{let m=JSON.parse(raw);if(m.date===todayKey())return m}catch(e){}}let m=buildMission();localStorage.setItem('skyMission',JSON.stringify(m));return m}
let mission=loadMission();
function saveMission(){localStorage.setItem('skyMission',JSON.stringify(mission))}
function renderMission(){let cons=CONS.find(c=>c.id===mission.cons);document.getElementById('missionGrid').innerHTML=`<div class="mchip ${mission.foundStar?'found':''}">⭐ ${mission.star}${mission.foundStar?' ✓':''}</div><div class="mchip ${mission.foundCons?'found':''}">${cons.icon} ${cons.name}${mission.foundCons?' ✓':''}</div><div class="mchip ${mission.foundMoon?'found':''}">🌙 Lune${mission.foundMoon?' ✓':''}</div><div class="mchip ${mission.foundSat?'found':''}">🚀 ISS${mission.foundSat?' ✓':''}</div>`}
function checkMissionComplete(){if(mission.foundStar&&mission.foundCons&&mission.foundMoon&&mission.foundSat&&!mission.celebrated){mission.celebrated=true;saveMission();burstConfetti(100);setTimeout(()=>burstConfetti(100),350);setTimeout(()=>card('🎉 Mission accomplie !','Bravo petit astronome ! Tu as trouvé les 4 trésors du ciel de ce soir. Reviens demain pour une nouvelle mission !',''),400)}}
function checkConstellations(name){CONS.forEach(cst=>{if(cst.stars.includes(name)){let all=cst.stars.every(n=>carnet.stars.includes(n));if(all){let isNew=addFound('constellations',cst.id);if(isNew){toast(cst.icon+' Constellation dessinée : '+cst.name);burstConfetti(40);if(cst.id===mission.cons&&!mission.foundCons){mission.foundCons=true;saveMission();renderMission()}checkMissionComplete()}}}})}

/* ===== confettis (canvas séparé, au-dessus de tout) ===== */
let confetti=[];
function burstConfetti(n){n=n||80;let colors=['#ffd86b','#7dffb2','#73caff','#ff8bcb','#ffffff'];for(let i=0;i<n;i++)confetti.push({x:W/2+(Math.random()-.5)*W*.7,y:-20-Math.random()*140,vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.2,r:3+Math.random()*4,col:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,life:130+Math.random()*70})}
function drawFx(){fxx.clearRect(0,0,W,H);confetti.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.rot+=p.vr;p.life--;fxx.save();fxx.translate(p.x,p.y);fxx.rotate(p.rot);fxx.fillStyle=p.col;fxx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);fxx.restore()});confetti=confetti.filter(p=>p.life>0&&p.y<H+40);requestAnimationFrame(drawFx)}

/* ===== boucle de dessin du ciel ===== */
function draw(){
  x.clearRect(0,0,W,H);
  let now=new Date(),t=now.getTime()/1000;
  if(!arMode){
    let g=x.createRadialGradient(W/2,H*.42,10,W/2,H*.42,Math.max(W,H)*.75);g.addColorStop(0,'#283d9122');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,W,H);
    bg.forEach(s=>{let a=s.b+Math.sin(t*s.sp+s.tw)*.15;x.fillStyle=`rgba(255,255,255,${Math.max(0,Math.min(1,a))})`;x.fillRect(s.x,s.y,s.r*2,s.r*2)});
  }
  let pts=[];
  S.forEach(s=>{let a=aa(s,now);if(a.alt>-4){let q=pos(a.az,a.alt);pts.push({...s,...a,...q})}});
  x.lineWidth=1.3;
  CONS.forEach(cst=>{x.strokeStyle=cst.color+'55';cst.lines.forEach(l=>{let A=pts.find(p=>p.n===l[0]),B=pts.find(p=>p.n===l[1]);if(A&&B){x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()}})});
  pts.forEach(p=>{
    let inCons=CONS.some(cst=>cst.stars.includes(p.n));
    let z=Math.max(inCons?2.2:1.5,4.7-p.m*1.35);
    x.beginPath();x.arc(p.x,p.y,z+5,0,7);x.fillStyle='#ffe27a0c';x.fill();
    x.beginPath();x.arc(p.x,p.y,z,0,7);x.fillStyle=p.m<0?'#fff0a2':'#fff';x.shadowBlur=12;x.shadowColor='#fff';x.fill();x.shadowBlur=0;
    if(p.m<1.2||inCons||p.n===mission.star){x.font='700 11px sans-serif';x.fillStyle='#ffffffc7';x.fillText(p.n,p.x+8,p.y-7)}
  });
  if(located){
    P.forEach(p=>{let a=paa(p[1],now);if(a&&a.alt>-3){let q=pos(a.az,a.alt);x.beginPath();x.arc(q.x,q.y,8,0,7);x.fillStyle='#ffd86b';x.shadowBlur=18;x.shadowColor='#ffd86b';x.fill();x.shadowBlur=0;x.font='800 11px sans-serif';x.fillStyle='#fff';x.fillText(p[0],q.x+11,q.y+4)}});
    let ma=paa('Moon',now);
    if(ma&&ma.alt>-3){let q=pos(ma.az,ma.alt);x.beginPath();x.arc(q.x,q.y,11,0,7);x.fillStyle='#eef1ff';x.shadowBlur=22;x.shadowColor='#eef1ff';x.fill();x.shadowBlur=0;x.font='800 11px sans-serif';x.fillStyle='#fff';x.fillText('Lune',q.x+15,q.y+4)}
  }
  if(showSat&&satOK)sats.forEach(s=>{let a=satPos(s,now);if(a&&a.alt>-2){let q=pos(a.az,a.alt);x.beginPath();x.arc(q.x,q.y,4,0,7);x.fillStyle='#7dffb2';x.shadowBlur=15;x.shadowColor='#7dffb2';x.fill();x.shadowBlur=0;x.font='800 9px sans-serif';x.fillStyle='#9cffc3';x.fillText(s.name,q.x+7,q.y-5)}});
  x.font='900 13px sans-serif';x.fillStyle='#ffffff8c';
  [['N',0],['E',90],['S',180],['O',270]].forEach(a=>{let r=Math.min(W,H)*.42,v=a[1]-(oriented?head:0);x.fillText(a[0],W/2+Math.sin(rad(v))*r-4,H/2-Math.cos(rad(v))*r+5)});
  requestAnimationFrame(draw);
}

async function showWeather(){
  if(!located){closeCard();return toast('📍 Active d’abord ta position.')}
  card('☁️ Météo du ciel','Je regarde le ciel de ce soir…','');
  try{
    let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=cloud_cover,precipitation,wind_speed_10m&timezone=auto`,{cache:'no-store'});
    let d=await r.json();
    let cc=d.current.cloud_cover,rain=d.current.precipitation,wind=d.current.wind_speed_10m;
    let mp=moonPhaseInfo(new Date()),moonBright=mp.angle>135&&mp.angle<225;
    let rating,emoji,msg;
    if(rain>0.2){rating='Pas top';emoji='🌧️';msg='Il pleut, on garde les étoiles pour un autre soir !'}
    else if(cc<20){rating='Excellente';emoji='☀️';msg='Le ciel est bien dégagé, c’est parfait pour observer !'}
    else if(cc<50){rating='Bonne';emoji='⛅';msg='Quelques nuages, mais on devrait bien voir les étoiles brillantes.'}
    else if(cc<80){rating='Moyenne';emoji='☁️';msg='Le ciel est assez nuageux, ce sera plus difficile ce soir.'}
    else{rating='Difficile';emoji='☁️';msg='Le ciel est très couvert, il vaudra mieux réessayer un autre soir.'}
    let extra=moonBright?' La pleine lune éclaire aussi beaucoup le ciel ce soir.':'';
    card(emoji+' Qualité du ciel : '+rating,msg+extra,`<span class="badge">☁️ ${Math.round(cc)}% de nuages</span><span class="badge">💨 ${Math.round(wind)} km/h</span>`);
  }catch(e){card('☁️ Météo du ciel','Impossible de récupérer la météo pour le moment.','')}
}

/* ===== satellites =====
   CelesTrak bloque les proxys CORS publics via son robots.txt, donc la source
   fiable pour l'ISS est désormais l'API dédiée wheretheiss.at (CORS ouvert,
   sans clé, pensée pour un usage direct depuis un navigateur). Les autres
   satellites visibles restent tentés en bonus via CelesTrak + proxys, en
   parallèle et avec un délai court pour ne jamais bloquer longtemps. */
function parseSats(list){
  let seen=new Set();
  return list.map(o=>{try{return{name:o.OBJECT_NAME||'Satellite',satrec:satellite.twoline2satrec(o.TLE_LINE1,o.TLE_LINE2)}}catch(e){return null}}).filter(Boolean).filter(o=>{if(seen.has(o.name))return false;seen.add(o.name);return true});
}
async function fetchWithTimeout(u,ms){
  let ctrl=new AbortController(),id=setTimeout(()=>ctrl.abort(),ms);
  try{let r=await fetch(u,{cache:'no-store',signal:ctrl.signal});clearTimeout(id);return r}catch(e){clearTimeout(id);throw e}
}
async function fetchISS(){
  try{
    let r=await fetchWithTimeout('https://api.wheretheiss.at/v1/satellites/25544/tles?format=json',6000);
    if(!r.ok)return null;
    let d=await r.json();
    if(!d.line1||!d.line2)return null;
    return [{OBJECT_NAME:'ISS (ZARYA)',TLE_LINE1:d.line1,TLE_LINE2:d.line2}];
  }catch(e){return null}
}
function proxied(u,i){
  if(i===0)return u;
  if(i===1)return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u);
  if(i===2)return 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u);
  return 'https://corsproxy.io/?url='+encodeURIComponent(u);
}
async function fetchExtra(u){
  let attempts=[0,1,2,3].map(i=>fetchWithTimeout(proxied(u,i),6000).then(async r=>{if(!r.ok)throw 0;let j=await r.json();if(!Array.isArray(j)||!j.length)throw 0;return j}));
  try{return await Promise.any(attempts)}catch(e){return null}
}
async function loadSat(){
  if(satOK)return;
  toast('🛰️ Je récupère les satellites…');
  let all=await fetchISS()||[];
  try{
    let extra=await fetchExtra('https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=json');
    if(extra)all=all.concat(extra);
  }catch(e){}
  if(all.length){
    sats=parseSats(all);satOK=sats.length>0;
    if(satOK){try{localStorage.setItem('skySatCache',JSON.stringify({t:Date.now(),data:all}))}catch(e){}}
    toast(satOK?`🛰️ ${sats.length} satellite(s) chargé(s)`:'Impossible de charger les satellites.');
    return;
  }
  try{
    let cache=JSON.parse(localStorage.getItem('skySatCache')||'null');
    if(cache&&cache.data&&cache.data.length){
      sats=parseSats(cache.data);satOK=sats.length>0;
      toast(satOK?`🛰️ ${sats.length} satellite(s) (dernières données connues)`:'Impossible de charger les satellites.');
      return;
    }
  }catch(e){}
  toast('Impossible de charger les satellites (vérifie ta connexion).');
}

/* ===== interaction tactile sur le ciel : un doigt = sélectionner, deux doigts = zoomer ===== */
function handleTap(cx,cy){
  let d=new Date();
  let best=null,bd=30;
  S.forEach(s=>{let a=aa(s,d);if(a.alt>-4){let q=pos(a.az,a.alt),z=Math.hypot(q.x-cx,q.y-cy);if(z<bd){bd=z;best={...s,...a}}}});
  if(best){onFoundStar(best);return}
  if(located){
    let bp=null,bd2=30;
    P.forEach(p=>{let a=paa(p[1],d);if(a&&a.alt>-3){let q=pos(a.az,a.alt),z=Math.hypot(q.x-cx,q.y-cy);if(z<bd2){bd2=z;bp={p,a}}}});
    if(bp){onFoundPlanet(bp.p,bp.a);return}
    let ma=paa('Moon',d);
    if(ma&&ma.alt>-3){let q=pos(ma.az,ma.alt);if(Math.hypot(q.x-cx,q.y-cy)<34){onFoundMoon(d);return}}
  }
  if(showSat&&satOK){
    let bs=null,bd3=30;
    sats.forEach(s=>{let a=satPos(s,d);if(a&&a.alt>-2){let q=pos(a.az,a.alt),z=Math.hypot(q.x-cx,q.y-cy);if(z<bd3){bd3=z;bs={s,a}}}});
    if(bs)onFoundSat(bs.s,bs.a);
  }
}
c.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    tapStart={x:e.clientX,y:e.clientY,id:e.pointerId,t:Date.now()};
    panStart={x:e.clientX,y:e.clientY,panX0:panX,panY0:panY};
  }else if(pointers.size===2){
    tapStart=null;panStart=null;
    let pts=[...pointers.values()];pinch={startDist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),startZoom:zoom};
  }
});
c.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinch){
    let pts=[...pointers.values()],dd=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    zoom=Math.min(MAXZ,Math.max(MINZ,pinch.startZoom*(dd/pinch.startDist)));
    clampPan();
  }else if(pointers.size===1&&panStart){
    let dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
    if(zoom>1.02){panX=panStart.panX0+dx;panY=panStart.panY0+dy;clampPan()}
    if(tapStart&&Math.hypot(dx,dy)>14)tapStart=null;
  }
});
function endPointer(e){
  if(pointers.size===1&&tapStart&&tapStart.id===e.pointerId){
    let dist=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y),dt=Date.now()-tapStart.t;
    if(dist<14&&dt<600)handleTap(e.clientX,e.clientY);
  }
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinch=null;
  tapStart=null;panStart=null;
}
c.addEventListener('pointerup',endPointer);
c.addEventListener('pointercancel',endPointer);
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(MAXZ,zoom*1.25);clampPan()};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(MINZ,zoom/1.25);clampPan()};
document.getElementById('zoomReset').onclick=()=>{zoom=1;panX=0;panY=0};
